<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos y Expedientes · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1B33; --blue:#1F5BD8; --blue-d:#174BB8; --ink:#121826; --ink2:#2B3342; --muted:#5B6474;
    --line:#E3E7EE; --bg:#F4F6F9; --ok:#0F6B3A; --ok-bg:#E3F4EA; --warn:#8A4A00; --warn-bg:#FFF0D9;
    --err:#A21C1C; --err-bg:#FDE7E7; --info:#1F4FB8; --info-bg:#E6EEFC;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
  a{color:var(--blue)} a:hover{color:var(--blue-d)}
  header.top{background:var(--navy);color:#fff;padding:14px 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .top-actions label{font-size:13px;color:#C9D3E6;display:flex;gap:8px;align-items:center}
  main{max-width:1280px;margin:0 auto;padding:28px;display:flex;flex-direction:column;gap:24px}
  h1{margin:0;font-size:26px} h2{margin:0;font-size:17px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
  input,select{min-height:44px;border:1px solid #CBD2DD;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);width:100%}
  input[type=file]{padding:9px 10px;font-size:13px}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #CBD2DD;background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap}
  .btn:hover{background:#F1F4F8}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-sm{min-height:36px;padding:0 12px;font-size:13px}
  .btn[disabled]{opacity:.6;cursor:wait}
  .chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
  .c-err{background:var(--err-bg);color:var(--err)} .c-info{background:var(--info-bg);color:var(--info)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .partida{display:flex;flex-direction:column;gap:14px}
  .p-title{font-size:16px;font-weight:700;word-break:break-word}
  .p-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .slot{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FBFCFD}
  .slot.done{background:#F3FAF6;border-color:#BFE3CC}
  .slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .slot small{color:var(--muted);font-size:12px;line-height:1.4}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .empty{text-align:center;color:var(--muted);padding:40px}
  #toast{position:fixed;right:20px;bottom:20px;max-width:420px;padding:14px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.15);display:none;z-index:10;line-height:1.45}
  dialog{border:0;border-radius:12px;padding:24px;max-width:520px;width:92%}
  dialog::backdrop{background:rgba(14,27,51,.5)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">PA</div>Pagos y Expedientes</div>
  <div class="top-actions">
    <label>Mes <input type="month" id="mes" style="min-height:40px;width:auto"></label>
    <button class="btn btn-sm" id="btnRefrescar" type="button">Actualizar</button>
    <button class="btn btn-sm" id="btnConfig" type="button">Configurar</button>
  </div>
</header>

<main>
  <div>
    <h1>Partidas de pago</h1>
    <div class="sub">Cada partida crea su carpeta en Drive: <b>MES / N°. PROVEEDOR $MONTO FECHA</b>. Los documentos se suben conforme llegan.</div>
  </div>

  <!-- NUEVA PARTIDA -->
  <section class="card" aria-labelledby="tNueva">
    <h2 id="tNueva" style="margin-bottom:14px">Nueva partida</h2>
    <form id="formNueva">
      <div class="grid">
        <label class="f">Fecha programada <input type="date" name="fechaProgramada" required></label>
        <label class="f">Proyecto
          <input name="proyecto" list="proyectos" placeholder="Ej. VERACRUZ" required>
          <datalist id="proyectos"><option value="VERACRUZ"><option value="ALM"><option value="ARE"></datalist>
        </label>
        <label class="f">Proveedor / beneficiario <input name="proveedor" required placeholder="Ej. DRAKKAR SYSTEMS & ELECTRONICS"></label>
        <label class="f">Forma de pago
          <select name="formaPago">
            <option>TRANSFERENCIA 8018</option><option>EFECTIVALE</option>
            <option>DEPÓSITO CUENTA PERSONAL</option><option>AMEX</option><option>EFECTIVO</option>
          </select>
        </label>
        <label class="f">OC / referencia <input name="oc" placeholder="Ej. OC-VER-045 o SIN OC"></label>
        <label class="f">Monto programado <input name="montoProgramado" inputmode="decimal" required placeholder="0.00"></label>
      </div>
      <label class="f" style="margin-top:14px">Concepto <input name="concepto" placeholder="Descripción del pago"></label>
      <div class="grid" style="margin-top:14px">
        <label class="f">Orden de compra (opcional) <input type="file" name="fileOC" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.docx"></label>
        <label class="f">Cotización (opcional) <input type="file" name="fileCOT" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.docx"></label>
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end">
        <button class="btn btn-primary" type="submit" id="btnCrear">Crear partida y carpeta</button>
      </div>
    </form>
  </section>

  <!-- LISTA -->
  <section aria-labelledby="tLista" style="display:flex;flex-direction:column;gap:14px">
    <div class="row">
      <h2 id="tLista">Partidas del mes</h2>
      <span class="sub" id="resumen"></span>
    </div>
    <div id="lista" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</main>

<!-- CONFIGURACIÓN -->
<dialog id="dlgConfig">
  <form method="dialog" id="formConfig" style="display:flex;flex-direction:column;gap:14px">
    <h2>Configurar conexión</h2>
    <div class="sub" style="margin:0">Se guarda solo en este navegador.</div>
    <label class="f">URL de la Web App de Apps Script (termina en /exec)
      <input name="url" required placeholder="https://script.google.com/macros/s/.../exec">
    </label>
    <label class="f">Clave de acceso (la muestra setup() en Apps Script)
      <input name="key" required>
    </label>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
      <button class="btn btn-primary" value="ok" type="submit">Guardar y probar</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIGURACIÓN ============ */
// Puedes pegar aquí la URL de tu Web App para no capturarla en cada equipo.
// La CLAVE NO se pone aquí (el repositorio es público): se captura en "Configurar".
const API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbz-LNkv5JRcpKo6pLlzd5gBpOH6u3zOYbF3RN0DNjMgVz64hEmQEcx-TYL6TWTgFZA/exec';
const MAX_MB = 30;

const DOCS = [
  { tipo: 'OC',          label: 'Orden de compra',      accept: '.pdf,.jpg,.jpeg,.png,.xlsx,.docx', col: 'OC_URL' },
  { tipo: 'COTIZACION',  label: 'Cotización',           accept: '.pdf,.jpg,.jpeg,.png,.xlsx,.docx', col: 'COTIZACION_URL' },
  { tipo: 'PAGO',        label: 'Comprobante de pago',  accept: '.pdf,.jpg,.jpeg,.png',             col: 'PAGO_URL' },
  { tipo: 'FACTURA_PDF', label: 'Factura PDF',          accept: '.pdf',                             col: 'FACTURA_PDF_URL' },
  { tipo: 'FACTURA_XML', label: 'Factura XML',          accept: '.xml',                             col: 'FACTURA_XML_URL' },
  { tipo: 'COMPLEMENTO', label: 'Complemento de pago',  accept: '.xml,.pdf',                        col: 'COMPLEMENTO_URL' },
  { tipo: 'OTRO',        label: 'Otros (tickets, fotos…)', accept: '',                              col: 'OTROS_URL' }
];

/* ============ ESTADO ============ */
const cfg = {
  get url() { return localStorage.getItem('pa_url') || API_URL_DEFAULT; },
  get key() { return localStorage.getItem('pa_key') || ''; },
  save(url, key) { localStorage.setItem('pa_url', url.trim()); localStorage.setItem('pa_key', key.trim()); }
};
let partidas = [];

/* ============ UTILIDADES ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const money = n => '$' + num(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fechaMx = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function toast(msg, tipo = 'ok', ms = 4500) {
  const t = $('#toast');
  const map = { ok: ['var(--ok-bg)', 'var(--ok)'], warn: ['var(--warn-bg)', 'var(--warn)'], err: ['var(--err-bg)', 'var(--err)'], info: ['var(--info-bg)', 'var(--info)'] };
  t.style.background = map[tipo][0]; t.style.color = map[tipo][1];
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms);
}

async function api(payload) {
  if (!cfg.url) throw new Error('Falta configurar la URL de la Web App');
  // text/plain evita el "preflight" CORS con Apps Script
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ ...payload, key: cfg.key }) });
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || 'Error desconocido');
  return data;
}

function leerArchivo(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_MB * 1024 * 1024) return reject(new Error(`"${file.name}" pesa más de ${MAX_MB} MB`));
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = () => reject(new Error('No se pudo leer ' + file.name));
    fr.readAsDataURL(file);
  });
}

async function subir(partida, tipo, file, extra = {}) {
  const base64 = await leerArchivo(file);
  return api({ action: 'subirArchivo', partida, tipo, nombre: file.name, mimeType: file.type || 'application/octet-stream', base64, ...extra });
}

/* ============ CARGAR Y PINTAR ============ */
async function cargar() {
  const mes = $('#mes').value;
  $('#lista').innerHTML = '<div class="card empty">Cargando…</div>';
  try {
    const data = await api({ action: 'listar', mes });
    partidas = data.partidas;
    pintar();
    return true;
  } catch (e) {
    $('#lista').innerHTML = `<div class="card empty">${esc(e.message)}</div>`;
    toast(e.message, 'err', 8000);
    return false;
  }
}

function estatusChip(e) {
  const cls = e === 'COMPLETO' ? 'c-ok' : e === 'PROGRAMADO' ? 'c-info' : 'c-warn';
  return `<span class="chip ${cls}">${esc(e || 'PROGRAMADO')}</span>`;
}

function pintar() {
  const lista = $('#lista');
  if (!partidas.length) {
    lista.innerHTML = '<div class="card empty">No hay partidas en este mes.</div>';
    $('#resumen').textContent = '';
    return;
  }
  const prog = partidas.reduce((a, p) => a + num(p.MONTO_PROGRAMADO), 0);
  const pag = partidas.reduce((a, p) => a + num(p.MONTO_PAGADO), 0);
  const inc = partidas.filter(p => p.ESTATUS !== 'COMPLETO').length;
  $('#resumen').textContent = `${partidas.length} partidas · Programado ${money(prog)} · Pagado ${money(pag)} · ${inc} expedientes incompletos`;

  lista.innerHTML = partidas.map(p => {
    const slots = DOCS.map(d => {
      const url = p[d.col];
      const done = !!url;
      const links = done ? url.split('\n').map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">Ver archivo${url.includes('\n') ? ' ' + (i + 1) : ''}</a>`).join(' · ') : '';
      let extraInfo = '';
      if (d.tipo === 'FACTURA_XML' && p.FACTURA_UUID) extraInfo = `<small>UUID ${esc(p.FACTURA_UUID)}<br>RFC ${esc(p.FACTURA_RFC)} · Total ${money(p.FACTURA_TOTAL)}</small>`;
      if (d.tipo === 'COMPLEMENTO' && p.COMPLEMENTO_UUID) extraInfo = `<small>UUID ${esc(p.COMPLEMENTO_UUID)}</small>`;
      if (d.tipo === 'PAGO' && p.MONTO_PAGADO) extraInfo = `<small>Pagado ${money(p.MONTO_PAGADO)} el ${fechaMx(p.FECHA_PAGO)}</small>`;
      const camposPago = d.tipo === 'PAGO' ? `
        <div class="two">
          <label class="sr" for="mp-${p.PARTIDA}">Monto pagado</label>
          <input id="mp-${p.PARTIDA}" data-monto inputmode="decimal" placeholder="Monto pagado" value="${esc(p.MONTO_PAGADO || p.MONTO_PROGRAMADO)}">
          <label class="sr" for="fp-${p.PARTIDA}">Fecha de pago</label>
          <input id="fp-${p.PARTIDA}" data-fecha type="date" value="${esc(p.FECHA_PAGO || hoy())}">
        </div>` : '';
      return `
        <div class="slot ${done ? 'done' : ''}" data-partida="${esc(p.PARTIDA)}" data-tipo="${d.tipo}">
          <div class="slot-h"><span>${d.label}</span>${done ? '<span class="chip c-ok">Cargado</span>' : '<span class="chip c-warn">Pendiente</span>'}</div>
          ${done ? `<small>${links}</small>` : ''}
          ${extraInfo}
          ${camposPago}
          <label class="sr" for="f-${p.PARTIDA}-${d.tipo}">Archivo ${d.label}</label>
          <input id="f-${p.PARTIDA}-${d.tipo}" type="file" ${d.accept ? `accept="${d.accept}"` : ''} ${d.tipo === 'OTRO' ? 'multiple' : ''}>
          <button class="btn btn-sm ${done ? '' : 'btn-primary'}" type="button" data-subir>${done ? (d.tipo === 'OTRO' ? 'Agregar' : 'Reemplazar') : 'Subir'}</button>
        </div>`;
    }).join('');

    return `
      <article class="card partida">
        <div class="row">
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
            <div class="p-title">${esc(p.PARTIDA)}. ${esc(p.PROVEEDOR)} ${money(p.MONTO_PAGADO || p.MONTO_PROGRAMADO)}</div>
            <div class="p-meta">
              <span>Proyecto: <b>${esc(p.PROYECTO)}</b></span>
              <span>OC: <b>${esc(p.OC || '—')}</b></span>
              <span>Forma: ${esc(p.FORMA_PAGO)}</span>
              <span>Programado: ${money(p.MONTO_PROGRAMADO)} para ${fechaMx(p.FECHA_PROGRAMADA)}</span>
            </div>
            ${p.CONCEPTO ? `<div style="font-size:14px;color:var(--ink2)">${esc(p.CONCEPTO)}</div>` : ''}
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            ${estatusChip(p.ESTATUS)}
            <a class="btn btn-sm" href="${esc(p.CARPETA_URL)}" target="_blank" rel="noopener">Abrir carpeta en Drive</a>
          </div>
        </div>
        <div class="slots">${slots}</div>
      </article>`;
  }).join('');
}

/* ============ EVENTOS ============ */
// Subir documento desde una partida
$('#lista').addEventListener('click', async ev => {
  const btn = ev.target.closest('[data-subir]');
  if (!btn) return;
  const slot = btn.closest('.slot');
  const partida = slot.dataset.partida, tipo = slot.dataset.tipo;
  const files = [...slot.querySelector('input[type=file]').files];
  if (!files.length) return toast('Selecciona un archivo primero', 'warn');

  const extra = {};
  if (tipo === 'PAGO') {
    extra.montoPagado = slot.querySelector('[data-monto]').value;
    extra.fechaPago = slot.querySelector('[data-fecha]').value;
    if (!num(extra.montoPagado) || !extra.fechaPago) return toast('Captura monto y fecha del pago', 'warn');
  }

  btn.disabled = true; btn.textContent = 'Subiendo…';
  try {
    let res;
    for (const f of files) res = await subir(partida, tipo, f, extra);
    const i = partidas.findIndex(x => String(x.PARTIDA) === String(partida));
    if (i >= 0) partidas[i] = res.partida;
    pintar();
    if (res.aviso) toast('Guardado. Atención: ' + res.aviso, 'warn', 9000);
    else toast(tipo === 'PAGO' ? 'Pago registrado. La carpeta se renombró con el monto y fecha reales.' : 'Archivo guardado en Drive');
  } catch (e) {
    toast(e.message, 'err', 8000);
    btn.disabled = false; btn.textContent = 'Subir';
  }
});

// Crear partida
$('#formNueva').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, btn = $('#btnCrear');
  const d = Object.fromEntries(new FormData(f));
  delete d.fileOC; delete d.fileCOT;
  btn.disabled = true; btn.textContent = 'Creando carpeta…';
  try {
    const { partida } = await api({ action: 'crearPartida', ...d });
    const oc = f.fileOC.files[0], cot = f.fileCOT.files[0];
    if (oc) { btn.textContent = 'Subiendo OC…'; await subir(partida.PARTIDA, 'OC', oc); }
    if (cot) { btn.textContent = 'Subiendo cotización…'; await subir(partida.PARTIDA, 'COTIZACION', cot); }
    toast(`Partida ${partida.PARTIDA} creada con su carpeta en Drive`);
    f.reset();
    $('#mes').value = partida.MES_CARPETA;
    await cargar();
  } catch (e) {
    toast(e.message, 'err', 8000);
  } finally {
    btn.disabled = false; btn.textContent = 'Crear partida y carpeta';
  }
});

// Configuración
function abrirConfig() {
  const fc = $('#formConfig');
  fc.url.value = cfg.url; fc.key.value = cfg.key;
  $('#dlgConfig').showModal();
}
$('#btnConfig').addEventListener('click', abrirConfig);
$('#dlgConfig').addEventListener('close', async () => {
  if ($('#dlgConfig').returnValue !== 'ok') return;
  const fc = $('#formConfig');
  cfg.save(fc.url.value, fc.key.value);
  toast('Probando conexión…', 'info');
  if (await cargar()) toast('Conectado a Google Drive', 'ok');
});

$('#btnRefrescar').addEventListener('click', cargar);
$('#mes').addEventListener('change', cargar);

/* ============ INICIO ============ */
$('#mes').value = hoy().slice(0, 7);
if (!cfg.url || !cfg.key) abrirConfig(); else cargar();
</script>
</body>
</html>
